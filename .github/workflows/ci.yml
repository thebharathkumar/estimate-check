name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Tests
        run: pytest
      - name: Demo runs offline
        env:
          ANTHROPIC_API_KEY: ""
        run: estimate-check demo
      - name: Environment checks
        run: estimate-check doctor
      - name: Seed set metrics
        run: estimate-check eval
