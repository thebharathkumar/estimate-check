[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "estimate-check"
version = "0.1.0"
description = "A deterministic verifier for restoration estimate line items"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bharath Kumar Rajesh" }]
keywords = ["restoration", "estimating", "verification", "quality-control"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
judge = ["anthropic==1.5.0"]
dev = ["pytest==9.1.1"]

[project.scripts]
estimate-check = "estimate_check.cli:main"

[project.urls]
Homepage = "https://github.com/thebharathkumar/estimate-check"

[tool.setuptools.packages.find]
include = ["estimate_check*"]

[tool.setuptools.package-data]
estimate_check = ["data/*.json", "data/jobs/*.json", "data/seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
